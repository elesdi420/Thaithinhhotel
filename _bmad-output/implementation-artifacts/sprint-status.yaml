action_items:
  - id: AI-1
    status: done
    title: Vietnamese guests received no email at all
    detail: >
      mails/vn/ did not exist (only mails/en/). Mail::send() has no language fallback -
      it hard-fails when the template is missing, so every transactional email to a
      Vietnamese customer (id_lang=2) silently returned false. The site defaults to
      Vietnamese, so this hit real guests, not an edge case. Proven by control test:
      id_lang=1 -> true, id_lang=2 -> false, while SMTP itself answered 220 OK.
      Fixed by creating mails/vn/ (115 templates), translating order_conf into
      Vietnamese, and removing the leftover "powered by Webkul" line from the
      customer-facing email. Re-verified end to end: a Vietnamese-language order paid
      via webhook now delivers "Đã nhận được thanh toán đầy đủ" to Mailpit.
  - id: AI-2
    status: open
    title: VietQR is running on a placeholder account number
    detail: >
      Half closed. VIETQR_ACCOUNT_NAME was "CMS HOTEL PMS" - the old codename, not
      this hotel - and is now "THAITHINH HOTEL", fixed at the install default in
      modules/qlovietqr/qlovietqr.php as well as in the database, so a fresh clone
      no longer prints the wrong payee on the QR code.
      Still open: VIETQR_ACCOUNT_NO=0901234567 is a placeholder. The QR mechanics
      work, but money would not reach the hotel. The client has twice said to skip
      real bank details for now, so this stays open by their choice, not by
      oversight - it must be set before go-live.
  - id: AI-3
    status: done
    title: Webhook secret was published in a public repo, and no secret meant no auth
    detail: >
      Two defects, not one. First, VIETQR_WEBHOOK_SECRET shipped as "secret123",
      hardcoded at module install and dumped into the committed seed - and this
      repository is public, so the secret was readable by anyone. Picking a longer
      string would not have helped: any secret stored in a committed file is not a
      secret. Second, the guard read `if (!empty($expectedSecret))`, so clearing the
      config disabled authentication altogether and left an endpoint that marks
      bookings paid wide open (fail-open).
      Fixed by moving the secret to the environment - the pattern this project already
      set for SMTP in story 1.4 - via QloVietQr::getWebhookSecret(), which reads the
      env var first and falls back to Configuration. The module now installs with an
      empty secret instead of a shipped one, the guard fails closed with 503 when
      nothing is configured, and comparison uses hash_equals. Header
      (X-Webhook-Secret) is preferred but the ?token= parameter stays supported,
      because several Vietnamese gateways only let you configure a plain callback URL.
      Verified on a from-scratch rebuild: old "secret123" -> 401, new secret via
      header -> 200 and the order moves to paid, replay -> already_paid, underpayment
      -> 422, and with no secret configured a forged callback gets 503 while the order
      stays unpaid. secret123 no longer appears anywhere in the tracked tree.
      Regression caught 09-10-2026: secret123 was back in the database, restored by a
      seed dump taken before this fix. Runtime was still safe because the .env value
      wins, but a fresh clone with no .env would have fallen back to the published
      value - the fix had been applied to the code and lost from the data. The
      database value is now empty (fail-closed), and export_content_fixes.php writes
      the whole VIETQR group into docker/db/zz-content-fixes.sql, which runs after
      init.sql, so a future dump cannot bring it back a second time.
  - id: AI-4
    status: done
    title: Logo is still the stock QloApps "Qlo" mark
    detail: >
      Replaced with an original Thaithinh Hotel wordmark drawn for this project - a
      navy monogram tile with a gold building mark, plus the name - applied to the
      header, email and invoice logos. Drawn from scratch rather than taken from
      another hotel, whose logo would be their trademark. If the client has a real
      brand asset, swapping img/logo.jpg (420x110) is all that is needed.
  - id: AI-7
    status: done
    title: Demo shells for the two v2 features, clearly labelled as shells
    detail: >
      Requested for the client demo, explicitly interface-only. Both are static:
      no API calls, no storage, no business logic.
      (1) Floating chat widget bottom-right of the front office
      (themes/hotel-reservation-theme/chat-widget-mockup.tpl, included from
      footer.tpl) with the Thaithinh logo and the agreed greeting. Sending a message
      echoes it and returns one fixed reply saying automatic answers are still being
      built, followed by a "Giao diện demo - chưa đấu nối AI Chatbot" note, so nobody
      watching the demo concludes the bot understood the question.
      (2) Admin page "Đồng bộ OTA (Agoda/Airbnb)"
      (controllers/admin/AdminOtaSyncController.php plus its view template), added as
      a child of the existing OTA menu rather than a second top-level menu with a
      near-identical name. API key fields for Agoda, Airbnb, Booking.com and
      Traveloka, the requested "Tính năng sẵn sàng đấu nối" note, and a second notice
      stating the page is a demo that stores nothing. Visible to SuperAdmin and the
      chain manager only, matching how receptionists are already scoped.
      Both carry mockup warnings in their file headers. Replace the files wholesale
      when FR-9 and FR-14/15/16 are built for real; neither is wired to anything.
  - id: AI-5
    status: done
    title: The site advertises facilities nobody has confirmed exist
    detail: >
      Branch 1 lists these amenities, straight from the QloApps demo fixture and
      still in English: Business Center, Amphitheatre, Casino, DiscoTheatre,
      Welcome Drinks, NewsPaper In Lobby, Transfer Available, Internet Access,
      Fax Machine, Board room, Mini Theatre. Branches 2 and 3 list none at all.
      The home page separately promotes "World class chefs", "Restaurants" and
      "Gym & Spa". None of this appears in the client's requirements document.
      A casino claim is the sharp end: gambling is tightly licensed in Vietnam, so
      publishing it on a real hotel's site is not just inaccurate. These were left
      untranslated on purpose - translating an unverified claim only makes it wrong
      in two languages, the same reasoning that led to disabling the fake
      testimonials. Needs the client to say which facilities each branch actually
      has; until then the honest options are to clear the list or hide the block.
      Fixed in passing during this review: the "Secure payment" page still carried
      the demo disclaimer and told guests "we accept major credit cards", which is
      not how this hotel is paid - rewritten around VietQR in both languages.
      Also still open: the English versions of Policies, Legal Notice and Terms and
      Conditions are untouched demo boilerplate, opening with "This page contains
      demo content for illustrative purposes only". The Vietnamese versions of the
      same three pages are properly written. Left alone deliberately - drafting a
      real business's legal terms in another language is the client's call, not
      something to improvise. Either have them translated properly or turn the
      English language off until they are.
      Resolved by the second option on the client's instruction: English is now
      disabled (qlo_lang id 1 active=0), so the boilerplate pages are unreachable.
      Turning English back on brings them back - translate them properly first.
  - id: AI-6
    status: done
    title: Vietnamese was switched on without any interface translation files
    detail: >
      Same root cause as AI-1, one layer up. The shop runs with Vietnamese as the
      default language (PS_LANG_DEFAULT=2, iso "vn"), but no translation file
      existed anywhere: the theme shipped only lang/en.php, and 0 of the front-office
      modules have a translations/ directory at all. Every interface string therefore
      fell back to English, which is why the navigation reads "Home / Our Properties /
      Interior / Amenities / Rooms" on a Vietnamese site that claims full localisation.
      Done so far: created themes/hotel-reservation-theme/lang/vn.php, generated from
      en.php so the md5 keys match, with 33 of 1036 strings translated - the rest
      deliberately keep their English text, which cannot regress anything since that
      is what rendered before. Confirmed working: the account page title now renders
      "Đăng nhập". Also removed the "Powered by QloApps" line and its outbound link
      from the footer, which contradicted the white-label claim in the README.
      Still open: the home page is built almost entirely from module blocks, so it is
      untouched by the theme file. Finishing this means translation files for roughly
      a dozen modules (navigation, cart, newsletter, search widget, footer blocks) plus
      widening the theme dictionary - a story of its own, not a QA-pass side fix.
      Closed on branch feature/phase2-polish: two generator scripts now build the
      translation files (19 modules, 178 keys; theme, 221 strings) from a dictionary
      rather than by hand, and .gitignore was blocking /modules/*/translations/* so the
      work would not have left this machine - the fourth time that trap appeared.
      Home page, properties list and contact page carry no English at all; the room
      page has one label left, "Room - 1" in the occupancy picker.
  - id: AI-8
    status: done
    title: Check-in was impossible on every one of the 36 demo bookings
    detail: >
      The single worst defect of the review, and it was in our own seed script, not
      in QloApps. seed_demo_bookings.php left city, check_in_time, check_out_time and
      planned_check_out empty and wrote date_add as 0000-00-00. HotelBookingDetail
      extends ObjectModel, so pressing "Nhận phòng" calls save() -> validateFields(),
      which rejects those fields. The button would have done nothing at all, with no
      message on screen - the worst possible failure to hit live in front of the
      client.
      Found by running validateFields() over every existing record rather than by
      reading the code, which is what made it visible; the page renders fine and the
      list looks correct, so nothing about the screen suggests a problem.
      Fixed in two places: the existing rows were backfilled (needs SET SESSION
      sql_mode='' because of the zero dates), and the seeder now takes check-in and
      check-out times from htl_branch_info per hotel instead of hardcoding them, so
      the times match whatever each branch is configured for.
      Verified the hard way - wiped the bookings, re-ran the patched seeder from
      empty, and re-ran the sweep: 36/36 valid. Then drove the real handler,
      AdminOrdersController::changeRoomStatus(), through all three paths on a
      from-scratch rebuild: allotted -> checked in (2, timestamp 14:00), checked in ->
      checked out (3, timestamp 12:00), and check-out attempted before check-in
      correctly refused.
  - id: AI-9
    status: done
    title: Tools::displayError() has its own dictionary, and it did not exist
    detail: >
      The seventh discovery of the same root cause: Vietnamese switched on without
      the companion file. Every error message raised through Tools::displayError()
      was rendering in English even after the string had been added to
      translations/vn/admin.php, because that function does not use Translate:: at
      all - it includes translations/<iso>/errors.php directly, reads the global
      $_ERRORS, and looks up md5(str_replace("'", "\'", $string)), the md5 of the
      string as escaped in source, not as it exists at runtime. With no file, $_ERRORS
      is not an array and the function silently returns the English original.
      This is the third translation dictionary in the project, with a third key
      format: admin.php ($_LANGADM, class-prefixed md5), modules/*/translations/vn.php
      (module-prefixed md5), and now errors.php.
      Added scripts/generate_vn_errors.php with 109 strings: the seven guards in the
      check-in/check-out flow that reception meets exactly when something goes wrong,
      plus the room, date, cart, account, address and contact messages a guest can
      hit while booking. The project contains 1256 distinct displayError strings;
      the rest stay English on purpose - translating all of them is language-pack
      work, not demo preparation.
      .gitignore blocked the new file, the sixth time that trap has appeared, so the
      rule is now the glob !/translations/vn/*.php rather than one line per filename.
