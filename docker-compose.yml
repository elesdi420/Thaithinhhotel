services:
  db:
    image: mariadb:10.11
    container_name: qloapps_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # MariaDB chạy mọi tệp .sql trong thư mục này theo thứ tự bảng chữ cái,
      # nên tiền tố "zz-" đảm bảo tệp này chạy SAU init.sql ("z" > "i").
      # Nhờ vậy nội dung và cấu hình tự phục hồi kể cả khi init.sql bị ghi đè
      # bằng một bản dump cũ - đã xảy ra hai lần. Sinh lại bằng
      # scripts/export_content_fixes.php sau mỗi lần đổi nội dung.
      - ./docker/db/zz-content-fixes.sql:/docker-entrypoint-initdb.d/zz-content-fixes.sql:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: qloapps_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_SERVER: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Kept out of the committed DB seed on purpose - see .env.example
      VIETQR_WEBHOOK_SECRET: ${VIETQR_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit
    container_name: qloapps_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  db_data:
